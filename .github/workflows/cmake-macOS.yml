name: CI-macOS-AppleClang

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-12, compiler: clang++}
          - {os: macos-12, compiler: clang++-13}
          - {os: macos-12, compiler: clang++-14}
          - {os: macos-13, compiler: clang++}
          - {os: macos-13, compiler: clang++-15}
          - {os: macos-14, compiler: clang++}
          - {os: macos-14, compiler: clang++-16}
          - {os: macos-14, compiler: clang++-17}
    
    runs-on: ${{ matrix.config.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      # Install Clang versions first (for all jobs that need them)
      - name: Install Clang 15
        if: contains(matrix.config.compiler, 'clang++-15')
        run: |
          brew install llvm@15
          echo "/opt/homebrew/opt/llvm@15/bin" >> $GITHUB_PATH
          echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.zshrc
          sudo ln -sf /opt/homebrew/opt/llvm@15/bin/clang++ /usr/local/bin/clang++-15
      
      - name: Install Clang 16
        if: contains(matrix.config.compiler, 'clang++-16')
        run: |
          brew install llvm@16
          echo "/opt/homebrew/opt/llvm@16/bin" >> $GITHUB_PATH
          echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.zshrc
          sudo ln -sf /opt/homebrew/opt/llvm@16/bin/clang++ /usr/local/bin/clang++-16
      
      - name: Install Clang 17
        if: contains(matrix.config.compiler, 'clang++-17') 
        run: |
          brew install llvm@17
          echo "/opt/homebrew/opt/llvm@17/bin" >> $GITHUB_PATH
          echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.zshrc
          sudo ln -sf /opt/homebrew/opt/llvm@17/bin/clang++ /usr/local/bin/clang++-17

      # Verify system and compiler
      - name: Verify System & Compiler
        run: |
          echo "System Info:"
          uname -a
          echo "Using Clang version:"
          
          # Use the compiler directly without the conditional check
          # This works because we've installed the compilers and added them to the path
          ${{ matrix.config.compiler }} --version

      # Build and test
      - name: Build and Test
        run: |
          rm -rf build
          mkdir build
          cd build
          
          if [[ "$(uname -s)" == "Darwin" ]]; then
            CXX_FLAGS="-fsanitize=undefined -g"   # No memory sanitizer on macOS
          else
            CXX_FLAGS="-fsanitize=memory -fsanitize=undefined -g"
          fi
          
          cmake -D CMAKE_CXX_COMPILER="${{ matrix.config.compiler }}" \
                -D CMAKE_CXX_FLAGS="${CXX_FLAGS}" \
                -D DISABLE_NLP_ORACLES=ON \
                -D USE_MKL=OFF \
                ../test
          make
          ctest --verbose

      # For testing specific Clang versions with a test file
      - name: Create Test File
        run: |
          cat > main.cpp << 'EOF'
          #include <iostream>
          int main() {
            std::cout << "Hello from C++!" << std::endl;
            return 0;
          }
          EOF

      # Only run these tests when the specific compiler is used in the matrix
      - name: Build and Test with Clang 15
        if: contains(matrix.config.compiler, 'clang++-15')
        run: |
          clang++-15 -std=c++17 -o output15 main.cpp
          ./output15
          
      - name: Build and Test with Clang 16
        if: contains(matrix.config.compiler, 'clang++-16')
        run: |
          clang++-16 -std=c++17 -o output16 main.cpp
          ./output16
          
      - name: Build and Test with Clang 17
        if: contains(matrix.config.compiler, 'clang++-17')
        run: |
          clang++-17 -std=c++17 -o output17 main.cpp
          ./output17