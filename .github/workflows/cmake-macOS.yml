name: CI-macOS-AppleClang

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-12, compiler: clang++}
          - {os: macos-12, compiler: clang++-13}
          - {os: macos-12, compiler: clang++-14}
          - {os: macos-13, compiler: clang++}
          - {os: macos-13, compiler: clang++-15}
          - {os: macos-14, compiler: clang++}
          - {os: macos-14, compiler: clang++-16}
          - {os: macos-14, compiler: clang++-17}

    runs-on: ${{ matrix.config.os }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify System & Compiler
        run: |
          echo "System Info:"
          uname -a
          echo "Using Clang version:"
          ${{ matrix.config.compiler }} --version

      - name: Build and Test
        run: |
          rm -rf build
          mkdir build
          cd build
          
          if [[ "$(uname -s)" == "Darwin" ]]; then
            CXX_FLAGS="-fsanitize=undefined -g"   # No memory sanitizer on macOS
          else
            CXX_FLAGS="-fsanitize=memory -fsanitize=undefined -g"
          fi
          
          cmake -D CMAKE_CXX_COMPILER=${{ matrix.config.compiler }} \
                -D CMAKE_CXX_FLAGS="${CXX_FLAGS}" \
                -D DISABLE_NLP_ORACLES=ON \
                -D USE_MKL=OFF \
                ../test
          make
          ctest --verbose
      - name: Install Clang 15, 16, and 17
        run: |
          brew install llvm@15 llvm@16 llvm@17
          echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.bash_profile
          echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.zshrc
          source $HOME/.bash_profile

      - name: Verify Installed Clang Versions
        run: |
          echo "Clang 15 version:"
          /opt/homebrew/opt/llvm@15/bin/clang++ --version || echo "Clang 15 not found"
          
          echo "Clang 16 version:"
          /opt/homebrew/opt/llvm@16/bin/clang++ --version || echo "Clang 16 not found"
          
          echo "Clang 17 version:"
          /opt/homebrew/opt/llvm@17/bin/clang++ --version || echo "Clang 17 not found"

      - name: Build and Test with Clang 15
        run: |
          /opt/homebrew/opt/llvm@15/bin/clang++ -std=c++17 -o output15 main.cpp
          ./output15
          
      - name: Build and Test with Clang 16
        run: |
          /opt/homebrew/opt/llvm@16/bin/clang++ -std=c++17 -o output16 main.cpp
          ./output16
          
      - name: Build and Test with Clang 17
        run: |
          /opt/homebrew/opt/llvm@17/bin/clang++ -std=c++17 -o output17 main.cpp
          ./output17

