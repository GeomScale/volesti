name: CI-macOS-AppleClang

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-12, compiler: clang++}
          - {os: macos-12, compiler: clang++-13}
          - {os: macos-12, compiler: clang++-14}
          - {os: macos-13, compiler: clang++}
          - {os: macos-13, compiler: clang++-15}
          - {os: macos-14, compiler: clang++}
          - {os: macos-14, compiler: clang++-16}
          - {os: macos-14, compiler: clang++-17}
    
    runs-on: ${{ matrix.config.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      # Install Clang versions first
      - name: Install Required Clang Versions
        run: |
          if [[ "${{ matrix.config.compiler }}" == *"clang++-15"* ]]; then
            brew install llvm@15
            echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.bash_profile
            echo 'export PATH="/opt/homebrew/opt/llvm@15/bin:$PATH"' >> $HOME/.zshrc
            source $HOME/.bash_profile
            ln -s /opt/homebrew/opt/llvm@15/bin/clang++ /usr/local/bin/clang++-15 || true
          fi
          
          if [[ "${{ matrix.config.compiler }}" == *"clang++-16"* ]]; then
            brew install llvm@16
            echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.bash_profile
            echo 'export PATH="/opt/homebrew/opt/llvm@16/bin:$PATH"' >> $HOME/.zshrc
            source $HOME/.bash_profile
            ln -s /opt/homebrew/opt/llvm@16/bin/clang++ /usr/local/bin/clang++-16 || true
          fi
          
          if [[ "${{ matrix.config.compiler }}" == *"clang++-17"* ]]; then
            brew install llvm@17
            echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.bash_profile
            echo 'export PATH="/opt/homebrew/opt/llvm@17/bin:$PATH"' >> $HOME/.zshrc
            source $HOME/.bash_profile
            ln -s /opt/homebrew/opt/llvm@17/bin/clang++ /usr/local/bin/clang++-17 || true
          fi

      # Verify system and compiler after installation
      - name: Verify System & Compiler
        run: |
          echo "System Info:"
          uname -a
          echo "Using Clang version:"
          if [[ "${{ matrix.config.compiler }}" == *"clang++-15"* ]]; then
            /opt/homebrew/opt/llvm@15/bin/clang++ --version
          elif [[ "${{ matrix.config.compiler }}" == *"clang++-16"* ]]; then
            /opt/homebrew/opt/llvm@16/bin/clang++ --version
          elif [[ "${{ matrix.config.compiler }}" == *"clang++-17"* ]]; then
            /opt/homebrew/opt/llvm@17/bin/clang++ --version
          else
            ${{ matrix.config.compiler }} --version
          fi

      # Build and test
      - name: Build and Test
        run: |
          rm -rf build
          mkdir build
          cd build
          
          if [[ "$(uname -s)" == "Darwin" ]]; then
            CXX_FLAGS="-fsanitize=undefined -g"   # No memory sanitizer on macOS
          else
            CXX_FLAGS="-fsanitize=memory -fsanitize=undefined -g"
          fi
          
          # Use the correct compiler path for LLVM versions
          COMPILER="${{ matrix.config.compiler }}"
          if [[ "$COMPILER" == "clang++-15" ]]; then
            COMPILER="/opt/homebrew/opt/llvm@15/bin/clang++"
          elif [[ "$COMPILER" == "clang++-16" ]]; then
            COMPILER="/opt/homebrew/opt/llvm@16/bin/clang++"
          elif [[ "$COMPILER" == "clang++-17" ]]; then
            COMPILER="/opt/homebrew/opt/llvm@17/bin/clang++"
          fi
          
          cmake -D CMAKE_CXX_COMPILER="$COMPILER" \
                -D CMAKE_CXX_FLAGS="${CXX_FLAGS}" \
                -D DISABLE_NLP_ORACLES=ON \
                -D USE_MKL=OFF \
                ../test
          make
          ctest --verbose

      # For testing specific Clang versions with a test file
      - name: Create Test File
        run: |
          cat > main.cpp << 'EOF'
          #include <iostream>
          int main() {
            std::cout << "Hello from C++!" << std::endl;
            return 0;
          }
          EOF

      # Only run these tests when the specific compiler is used in the matrix
      - name: Build and Test with Clang 15
        if: matrix.config.compiler == 'clang++-15'
        run: |
          /opt/homebrew/opt/llvm@15/bin/clang++ -std=c++17 -o output15 main.cpp
          ./output15
          
      - name: Build and Test with Clang 16
        if: matrix.config.compiler == 'clang++-16'
        run: |
          /opt/homebrew/opt/llvm@16/bin/clang++ -std=c++17 -o output16 main.cpp
          ./output16
          
      - name: Build and Test with Clang 17
        if: matrix.config.compiler == 'clang++-17'
        run: |
          /opt/homebrew/opt/llvm@17/bin/clang++ -std=c++17 -o output17 main.cpp
          ./output17