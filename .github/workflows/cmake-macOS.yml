name: CI-macOS-AppleClang
on: [push, pull_request]
jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-12, compiler: clang++}
          - {os: macos-12, compiler: clang++-13}
          - {os: macos-12, compiler: clang++-14}
          - {os: macos-13, compiler: clang++}
          - {os: macos-13, compiler: clang++-15}
          - {os: macos-14, compiler: clang++}
          - {os: macos-14, compiler: clang++-16}
          - {os: macos-14, compiler: clang++-17}
    runs-on: ${{ matrix.config.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Install LLVM Compilers
        run: |
          echo "System Info:"
          uname -a

          # Install required compiler based on matrix configuration
          case "${{ matrix.config.compiler }}" in
            clang++-13) brew install llvm@13 ;;
            clang++-14) brew install llvm@14 ;;
            clang++-15) brew install llvm@15 ;;
            clang++-16) brew install llvm@16 ;;
            clang++-17) brew install llvm@17 ;;
            *) brew install llvm ;;  # Default to latest LLVM
          esac

          # Set correct compiler path dynamically
          LLVM_PATH="$(brew --prefix llvm)/bin/clang++"
          echo "COMPILER_PATH=$LLVM_PATH" >> $GITHUB_ENV
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Verify Compiler
        run: |
          echo "Using Clang version:"
          if [ ! -f "${{ env.COMPILER_PATH }}" ]; then
            echo "Error: Clang++ not found at ${{ env.COMPILER_PATH }}"
            exit 1
          fi
          ${{ env.COMPILER_PATH }} --version

      - name: Build and Test
        run: |
          cat > main.cpp << 'EOF'
          #include <iostream>
          int main() {
            std::cout << "Hello from C++!" << std::endl;
            return 0;
          }
          EOF

          ${{ env.COMPILER_PATH }} -std=c++17 -o output main.cpp
          ./output

          rm -rf build
          mkdir build
          cd build

          if [[ "$(uname -s)" == "Darwin" ]]; then
            CXX_FLAGS="-fsanitize=undefined -g"
          else
            CXX_FLAGS="-fsanitize=memory -fsanitize=undefined -g"
          fi

          cmake -D CMAKE_CXX_COMPILER="${{ env.COMPILER_PATH }}" \
                -D CMAKE_CXX_FLAGS="${CXX_FLAGS}" \
                -D DISABLE_NLP_ORACLES=ON \
                -D USE_MKL=OFF \
                ../test
          make
          ctest --verbose
