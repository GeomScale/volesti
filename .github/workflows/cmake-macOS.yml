name: CI-macOS-AppleClang

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-12, compiler: clang++}
          - {os: macos-12, compiler: clang++-13}
          - {os: macos-12, compiler: clang++-14}
          - {os: macos-13, compiler: clang++}
          - {os: macos-13, compiler: clang++-15}
          - {os: macos-14, compiler: clang++}
          - {os: macos-14, compiler: clang++-16}
          - {os: macos-14, compiler: clang++-17}
    
    runs-on: ${{ matrix.config.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      # Prepare LLVM compilers before trying to use them
      - name: Install LLVM Compilers
        run: |
          echo "System Info:"
          uname -a
          
          # Get architecture info
          ARCH=$(uname -m)
          echo "Running on architecture: $ARCH"
          
          # Install required compiler based on matrix configuration
          if [[ "${{ matrix.config.compiler }}" == "clang++-15" ]]; then
            brew install llvm@15
            if [[ "$ARCH" == "arm64" ]]; then
              LLVM_PATH=$(brew --prefix llvm@15)
            else
              LLVM_PATH="/usr/local/opt/llvm@15"
            fi
            echo "COMPILER_PATH=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV
            echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          elif [[ "${{ matrix.config.compiler }}" == "clang++-16" ]]; then
            brew install llvm@16
            if [[ "$ARCH" == "arm64" ]]; then
              LLVM_PATH=$(brew --prefix llvm@16)
            else
              LLVM_PATH="/usr/local/opt/llvm@16"
            fi
            echo "COMPILER_PATH=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV
            echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          elif [[ "${{ matrix.config.compiler }}" == "clang++-17" ]]; then
            brew install llvm@17
            if [[ "$ARCH" == "arm64" ]]; then
              LLVM_PATH=$(brew --prefix llvm@17)
            else
              LLVM_PATH="/usr/local/opt/llvm@17"
            fi
            echo "COMPILER_PATH=${LLVM_PATH}/bin/clang++" >> $GITHUB_ENV
            echo "${LLVM_PATH}/bin" >> $GITHUB_PATH
          elif [[ "${{ matrix.config.compiler }}" == "clang++-13" || "${{ matrix.config.compiler }}" == "clang++-14" ]]; then
            brew install ${{ matrix.config.compiler }}
            echo "COMPILER_PATH=${{ matrix.config.compiler }}" >> $GITHUB_ENV
          else
            echo "COMPILER_PATH=${{ matrix.config.compiler }}" >> $GITHUB_ENV
          fi
      
      # Verify the compiler is available
      - name: Verify Compiler
        run: |
          echo "Using Clang version:"
          which ${{ env.COMPILER_PATH }} || echo "Compiler not found in PATH"
          ${{ env.COMPILER_PATH }} --version
      
      # Build and test
      - name: Build and Test
        run: |
          # Create a test file
          cat > main.cpp << 'EOF'
          #include <iostream>
          int main() {
            std::cout << "Hello from C++!" << std::endl;
            return 0;
          }
          EOF
          
          # Test compiler with a simple file
          ${{ env.COMPILER_PATH }} -std=c++17 -o output main.cpp
          ./output
          
          # Build and test the main project
          rm -rf build
          mkdir build
          cd build
          
          if [[ "$(uname -s)" == "Darwin" ]]; then
            CXX_FLAGS="-fsanitize=undefined -g"   # No memory sanitizer on macOS
          else
            CXX_FLAGS="-fsanitize=memory -fsanitize=undefined -g"
          fi
          
          cmake -D CMAKE_CXX_COMPILER="${{ env.COMPILER_PATH }}" \
                -D CMAKE_CXX_FLAGS="${CXX_FLAGS}" \
                -D DISABLE_NLP_ORACLES=ON \
                -D USE_MKL=OFF \
                ../test
          make
          ctest --verbose