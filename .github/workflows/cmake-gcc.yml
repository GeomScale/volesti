name: cmake-gcc

on: [push, pull_request]

jobs:
  build:
    name: ${{ matrix.config.os }} - ${{ matrix.config.compiler }}
    strategy:
          fail-fast: false
          matrix:
            config:
              - {os: ubuntu-22.04, compiler: g++-9}
              - {os: ubuntu-22.04, compiler: g++-10}
              - {os: ubuntu-22.04, compiler: g++-11}
              - {os: ubuntu-22.04, compiler: g++-12}
              #- {os: ubuntu-22.04, compiler: g++-13}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4
      # OpenBLAS 0.3.20 (ubuntu-22.04) runs its Cooperlake kernels on CPUs with AVX512-BF16 (e.g. Sapphire Rapids
      # runners) and its DGEMM gives wrong results there (CHOLMOD supernodal tests fail); use the SkylakeX kernels.
      - name: Select OpenBLAS kernel
        run: |
          lscpu | grep 'Model name'
          if grep -q avx512_bf16 /proc/cpuinfo; then echo "OPENBLAS_CORETYPE=SkylakeX" >> "$GITHUB_ENV"; fi
      - run: sudo apt-get update || true;
             sudo apt-get install ${{ matrix.config.compiler }} lp-solve libopenblas-dev liblapack-dev;
             rm -rf build;
             mkdir build;
             cd build;
             cmake -D CMAKE_CXX_COMPILER=${{ matrix.config.compiler }} -D DISABLE_NLP_ORACLES=ON -D USE_MKL=OFF ../test;
             make -j$(nproc);
             ctest -j$(nproc) --verbose;
